name: Test custom iOS IPA on feature branch
on:
  push:
    branches:
      - feature/ios-swipe-custom-updates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Analyze, test and build iOS IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: arm64
          cache: true
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: Fetch Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Prepare rhttp native dependencies
        run: dart tool/prepare_rhttp_prebuilt.dart
      - name: Format patched files for the test build
        run: |
          dart format lib/features/swipe_dismiss lib/features/app_update
          dart format lib/features/reader/gesture.dart lib/features/reader/reader_page.dart
          dart format lib/features/comic_details/cover_viewer.dart lib/features/image_favorites/image_favorites_photo_view.dart
          dart format lib/features/settings/reader.dart lib/features/settings/about.dart
          dart format lib/foundation/app.dart lib/foundation/appdata.dart
          dart format test/features/swipe_dismiss
      - name: Static analysis
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/features/swipe_dismiss lib/features/reader/reader_page.dart lib/features/reader/gesture.dart lib/features/comic_details/cover_viewer.dart lib/features/image_favorites/image_favorites_photo_view.dart lib/features/settings/reader.dart lib/features/app_update lib/foundation/app.dart lib/foundation/appdata.dart test/features/swipe_dismiss
      - name: Test gesture priority
        run: flutter test test/features/swipe_dismiss/
      - name: Prepare Rust
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py --target aarch64-apple-darwin --target x86_64-apple-darwin --target aarch64-apple-ios
      - name: Serialize rustup
        run: |
          install "$(command -v rustup)" "$RUNNER_TEMP/rustup"
          mkdir -p "$HOME/.cargo/bin"
          rm -f "$HOME/.cargo/bin/rustup"
          install .github/scripts/serialized_rustup.py "$HOME/.cargo/bin/rustup"
          chmod +x "$HOME/.cargo/bin/rustup"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_REAL_BINARY=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_LOCK_FILE=$RUNNER_TEMP/venera-plus-rustup.lock" >> "$GITHUB_ENV"
      - name: Fetch iOS OpenList core
        run: python3 .github/scripts/fetch_openlist_core.py ios
      - name: Build unsigned iOS application
        env:
          BUILD_INDEX: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          NAME=$(printf "%s" "$APP_VERSION" | cut -d+ -f1)
          IOS_NAME=$(printf "%s" "$NAME" | cut -d- -f1)
          BUILD=$((100000 + BUILD_INDEX))
          sed -i '' "s/^version:.*/version: $NAME+$BUILD/" pubspec.yaml
          echo "CUSTOM_APP_VERSION=$NAME+$BUILD" >> "$GITHUB_ENV"
          flutter build ios --no-pub --release --no-codesign --build-name="$IOS_NAME" --build-number="$BUILD"
      - name: Package IPA
        run: |
          set -euo pipefail
          test -s build/ios/iphoneos/Runner.app/Runner
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qr "VeneraPlus-ios-$CUSTOM_APP_VERSION.ipa" Payload)
          rm -rf dist/Payload
          test -s "dist/VeneraPlus-ios-$CUSTOM_APP_VERSION.ipa"
      - name: Upload iPhone test IPA
        uses: actions/upload-artifact@v4
        with:
          name: custom-ios-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

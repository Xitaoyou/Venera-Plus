name: Fork iOS updates
on:
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: Merge upstream before building
        type: boolean
        default: false
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: fork-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge upstream
        if: github.event_name == 'schedule' || inputs.sync_upstream
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/Venera-Works/Venera-Plus.git
          git fetch upstream main
          git merge --no-edit upstream/main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/components/pull_down_to_dismiss.dart lib/features/comic_details/cover_viewer.dart lib/features/image_favorites/image_favorites_photo_view.dart lib/features/reader/gesture.dart lib/features/settings/reader.dart lib/foundation/appdata.dart test/components/pull_down_to_dismiss_test.dart
      - run: flutter analyze --no-fatal-infos --fatal-warnings
      - run: flutter test test/components/pull_down_to_dismiss_test.dart
      - name: Save validated changes
        id: ref
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test
          if ! git diff --cached --quiet; then git commit -m "style: format pull-down gesture integration"; fi
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      build_ref: ${{ needs.prepare.outputs.ref }}
      build_android: false
      build_windows: false
      build_macos: false
      build_ios: true
      build_linux_x64: false
      build_linux_arm64: false
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ios_build
          path: ipa
      - name: Publish latest fork IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view fork-ios-latest >/dev/null 2>&1; then
            gh release create fork-ios-latest --target "$GITHUB_REF_NAME" --prerelease --title 'Fork iOS latest' --notes 'Automatically built unsigned IPA. Sign before installing. See workflow logs for validation and merge status.'
          fi
          gh release upload fork-ios-latest ipa/*.ipa --clobber
